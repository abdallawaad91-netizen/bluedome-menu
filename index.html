<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Dome Menu</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f7ff;--card:#fff;--ink:#0d1f4d;--mute:#5a6b91;--brand:#1f47d1;--navy:#0c2a8a;--blue:#1f47d1;--tint:#e6efff;--line:#cfdcf7;--acc:#ff8a1f;--sh:0 3px 12px rgba(20,60,160,.10);--f1:"Lalezar","Cairo",Tahoma,sans-serif;--f2:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1330;--card:#12204a;--ink:#eef3ff;--mute:#a4b4dc;--blue:#8fb0ff;--tint:#1b2f66;--line:#2a3f7a;--sh:none}}
:root[data-theme="dark"]{--bg:#0a1330;--card:#12204a;--ink:#eef3ff;--mute:#a4b4dc;--blue:#8fb0ff;--tint:#1b2f66;--line:#2a3f7a;--sh:none}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 62px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f2);line-height:1.55;background-image:radial-gradient(circle at 1px 1px,rgba(31,71,209,.10) 1px,transparent 0);background-size:22px 22px}
.hero{position:relative;text-align:center;padding:22px 16px 44px;background:linear-gradient(180deg,#cfe0ff 0%,var(--bg) 100%);overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;background:var(--brand);opacity:.9;clip-path:polygon(0 0,100% 0,88% 30%,100% 55%,70% 70%,55% 100%,30% 75%,0 85%)}
.hero:before{top:-30px;left:-40px;width:170px;height:120px}
.hero:after{top:-30px;right:-40px;width:150px;height:110px;transform:scaleX(-1)}
.lg{position:relative;width:170px;height:auto;background:#fff;border-radius:20px;padding:8px 10px;box-shadow:var(--sh)}
.hero h1{position:relative;display:inline-block;margin:16px 0 6px;font-family:var(--f1);font-weight:400;font-size:32px;color:#fff;background:var(--brand);padding:2px 38px 8px;transform:rotate(-2deg);clip-path:polygon(1% 18%,6% 2%,28% 10%,52% 0,78% 8%,97% 2%,100% 42%,96% 72%,99% 100%,72% 92%,46% 100%,22% 93%,3% 100%,0 60%)}
.hero p{position:relative;margin:2px 0 0;color:var(--navy);font-weight:700;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:-24px 10px 0;padding:8px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:var(--card);box-shadow:0 5px 16px rgba(20,60,160,.16);border-radius:18px;border:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--blue);background:var(--tint);border-radius:999px;padding:6px 16px;font-size:15px;font-weight:700;transition:.2s}
nav a.on{background:var(--brand);color:#fff}
main{max-width:680px;margin:0 auto;padding:6px 14px 110px}
h2{margin:30px 0 14px;font-weight:400}
h2 span{display:inline-block;font-family:var(--f1);font-size:26px;color:#fff;background:var(--brand);padding:1px 30px 6px;transform:rotate(-1.5deg);clip-path:polygon(1% 15%,7% 0,35% 9%,62% 0,90% 7%,100% 0,99% 45%,100% 100%,72% 91%,40% 100%,12% 93%,0 100%,2% 55%)}
h2 i{display:none}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
.it img{width:96px;height:96px;object-fit:contain;flex:none;background:#fff;border-radius:14px;padding:4px}
.bd{flex:1;min-width:0}
.n{font-family:var(--f1);font-size:21px;line-height:1.3;color:var(--blue);font-weight:400}
.hot{display:inline-block;margin-inline-start:8px;background:var(--acc);color:#fff;font-family:var(--f2);font-size:11px;padding:1px 9px;border-radius:999px;vertical-align:middle;font-weight:700}
.d{color:var(--mute);font-size:13px;margin-top:2px}
.p{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.p button{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:3px 12px;font-family:var(--f1);font-size:18px;cursor:pointer;transform:skewX(-6deg)}
.p button em{font-style:normal;font-family:var(--f2);font-size:11.5px;font-weight:700;opacity:.9}
.p button b{font-weight:400}
.p button u{text-decoration:none;font-family:var(--f2);font-weight:800;background:#fff;color:var(--brand);border-radius:999px;min-width:22px;height:22px;line-height:22px;text-align:center;font-size:14px}
.p button.in{background:var(--acc)}.p button.in u{color:var(--acc)}
#bar{display:none;position:fixed;inset-inline:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:9;max-width:652px;margin:0 auto;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border:0;border-radius:16px;padding:13px 18px;font-family:var(--f2);font-size:16px;font-weight:800;box-shadow:0 8px 22px rgba(0,0,30,.35);cursor:pointer}
#bar .cnt{background:var(--acc);color:#fff;border-radius:999px;min-width:26px;padding:0 8px;text-align:center}
.sheet{display:none;position:fixed;inset:0;z-index:20;background:rgba(5,15,50,.55);align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.pn{background:var(--card);color:var(--ink);width:100%;max-width:680px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.hd{display:flex;justify-content:space-between;align-items:center;font-family:var(--f1);font-size:24px;color:var(--blue);margin-bottom:8px}
.hd button{background:var(--tint);color:var(--ink);border:0;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci small{display:block;color:var(--mute)}
.q{display:flex;align-items:center;gap:10px}
.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--blue);background:transparent;color:var(--blue);font-size:18px;cursor:pointer}
.tt{display:flex;justify-content:space-between;font-family:var(--f1);font-size:22px;padding:12px 0}
.pn input,.pn textarea{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
#go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:#25d366;color:#053b1c;font-family:var(--f1);font-size:22px;cursor:pointer}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 0 28px}
footer a{color:var(--blue);text-decoration:none;font-weight:700}
@media(min-width:520px){.it img{width:112px;height:112px}}
</style>
